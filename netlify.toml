[build]
  command = "npm run build"
  publish = ".next"
  # force rebuild to pick up corrected SUPABASE_URL env var

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/bloomboard-demo/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
