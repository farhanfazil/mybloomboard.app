[build]
  command = "npm run build"
  publish = ".next"
  # force rebuild to pick up corrected SUPABASE_URL env var

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/bloomboard-demo/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# The hero pictures are ready-made and never change under the same name (new pictures get a
# new folder, hero-v2/…), so browsers and the CDN can keep them for a year.
[[headers]]
  for = "/backgrounds/hero-v1/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
